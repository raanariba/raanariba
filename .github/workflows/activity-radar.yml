name: Update activity radar

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

concurrency:
  group: activity-radar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity radar
        env:
          ACTIVITY_RADAR_TOKEN: ${{ secrets.ACTIVITY_RADAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_activity_radar.py

      - name: Commit updated radar
        run: |
          if git diff --quiet -- assets/activity-radar.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-radar.svg
          git commit -m "chore: refresh activity radar"
          git push
